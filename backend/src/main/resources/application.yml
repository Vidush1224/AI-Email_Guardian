# AI Email Guardian - Backend Configuration

server:
  port: 8080

spring:
  application:
    name: email-guardian
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/email_guardian?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:guardian2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

# AI Service Configuration
ai-service:
  url: ${AI_SERVICE_URL:http://localhost:8000}
  timeout-ms: 5000

# Fraud Detection Configuration
fraud-detection:
  risk-threshold: 40
  company-domain: ${COMPANY_DOMAIN:company.com}
  weights:
    phishing: 0.30
    sensitive-data: 0.25
    domain-risk: 0.20
    attachment-risk: 0.15
    metadata-risk: 0.10

# VirusTotal (optional)
virustotal:
  api-key: ${VIRUSTOTAL_API_KEY:}
  enabled: ${VIRUSTOTAL_ENABLED:false}

logging:
  level:
    com.emailguardian: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
