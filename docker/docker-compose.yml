version: '3.8'

services:
  # ===== MySQL Database =====
  mysql-db:
    image: mysql:8.0
    container_name: email-guardian-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: guardian2026
      MYSQL_DATABASE: email_guardian
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pguardian2026"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===== Python AI Service =====
  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: email-guardian-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ===== Spring Boot Backend =====
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: email-guardian-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_USERNAME=root
      - DB_PASSWORD=guardian2026
      - AI_SERVICE_URL=http://ai-service:8000
      - COMPANY_DOMAIN=${COMPANY_DOMAIN:-company.com}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
      - VIRUSTOTAL_ENABLED=${VIRUSTOTAL_ENABLED:-false}
    depends_on:
      mysql-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/dashboard/stats"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===== Next.js Frontend =====
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: email-guardian-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8080
    depends_on:
      - backend

volumes:
  mysql-data:
    driver: local
